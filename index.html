<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATS Job Posting & Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif']
          },
          colors: {
            primary: '#2563eb',
            secondary: '#facc15'
          }
        }
      }
    }
  </script>
  <style>
    .fade-in {
      animation: fadeIn 0.5s ease-in-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-white font-sans min-h-screen">
  <div class="max-w-5xl mx-auto px-4 py-6">
    <!-- Toggle Theme -->
    <div class="flex justify-end mb-4">
      <button onclick="toggleTheme()" class="bg-primary dark:bg-secondary text-white dark:text-black px-4 py-2 rounded-md shadow hover:scale-105 transition-transform">
        Toggle Theme
      </button>
    </div>

    <!-- Job Posting Form -->
    <div class="bg-gray-100 dark:bg-gray-800 p-6 rounded-2xl shadow-xl mb-10">
      <h2 class="text-2xl font-bold mb-6 text-primary dark:text-secondary">Job Posting (Recruiter Side)</h2>
      <form id="jobForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <input type="text" placeholder="Job Title" id="title" class="col-span-1 md:col-span-2 p-3 rounded bg-white dark:bg-gray-700 shadow-inner focus:outline-primary" required />

        <select id="location" class="p-3 rounded bg-white dark:bg-gray-700 shadow-inner focus:outline-primary">
          <option value="Remote">Remote</option>
          <option value="Onsite">Onsite</option>
        </select>

        <select id="type" class="p-3 rounded bg-white dark:bg-gray-700 shadow-inner focus:outline-primary">
          <option>Full-Time</option>
          <option>Freelance</option>
          <option>Part-Time</option>
        </select>

        <textarea id="description" rows="4" placeholder="Job Description" class="col-span-1 md:col-span-2 p-3 rounded bg-white dark:bg-gray-700 shadow-inner focus:outline-primary"></textarea>

        <input type="text" id="skills" placeholder="Skills (comma-separated)" class="col-span-1 md:col-span-2 p-3 rounded bg-white dark:bg-gray-700 shadow-inner focus:outline-primary" />

        <input type="number" id="salaryMin" placeholder="Min Salary" class="p-3 rounded bg-white dark:bg-gray-700 shadow-inner focus:outline-primary" />
        <input type="number" id="salaryMax" placeholder="Max Salary" class="p-3 rounded bg-white dark:bg-gray-700 shadow-inner focus:outline-primary" />

        <select id="experience" class="col-span-1 md:col-span-2 p-3 rounded bg-white dark:bg-gray-700 shadow-inner focus:outline-primary">
          <option value="Fresher">Fresher</option>
          <option value="1-3 Years">1-3 Years</option>
          <option value="3-5 Years">3-5 Years</option>
          <option value="5+ Years">5+ Years</option>
        </select>

        <div class="col-span-1 md:col-span-2">
          <button type="button" onclick="generatePreview()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-md w-full font-semibold shadow-lg transition duration-300">
            Preview Job Post
          </button>
        </div>
      </form>
    </div>

    <!-- Preview Section -->
    <div id="preview" class="hidden bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-xl fade-in">
      <h2 class="text-2xl font-bold mb-2 text-primary dark:text-secondary" id="previewTitle"></h2>
      <p class="text-lg font-medium mb-1" id="previewCompany">Awesome Co.</p>
      <p class="text-sm text-gray-600 dark:text-gray-400 mb-4" id="previewLocationType"></p>
      <p class="mb-6 text-justify" id="previewDescription"></p>
      <div id="previewSkills" class="flex flex-wrap gap-2 mb-6"></div>
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <p class="font-semibold" id="previewSalaryExp"></p>
        <button class="bg-primary dark:bg-secondary text-white dark:text-black px-5 py-2 rounded-md hover:scale-105 transition-transform font-medium">
          Apply Now
        </button>
      </div>
    </div>
  </div>

  <script>
    function generatePreview() {
      const title = document.getElementById('title').value.trim();
      const location = document.getElementById('location').value;
      const type = document.getElementById('type').value;
      const description = document.getElementById('description').value.trim();
      const skills = document.getElementById('skills').value.trim();
      const salaryMin = document.getElementById('salaryMin').value;
      const salaryMax = document.getElementById('salaryMax').value;
      const experience = document.getElementById('experience').value;

      if (!title || !description || !skills || !salaryMin || !salaryMax) {
        alert("Please fill in all fields before previewing.");
        return;
      }

      document.getElementById('previewTitle').innerText = title;
      document.getElementById('previewLocationType').innerText = `${location} | ${type}`;
      document.getElementById('previewDescription').innerText = description;
      document.getElementById('previewSalaryExp').innerText = `Salary: ${salaryMin} - ${salaryMax} USD | Experience: ${experience}`;

      const skillArr = skills.split(',');
      const tagHTML = skillArr.map(skill => `<span class='bg-blue-100 dark:bg-blue-700 text-blue-800 dark:text-white px-3 py-1 rounded-full text-sm'>${skill.trim()}</span>`).join('');
      document.getElementById('previewSkills').innerHTML = tagHTML;

      const previewBox = document.getElementById('preview');
      previewBox.classList.remove('hidden');
      previewBox.classList.add('fade-in');
      previewBox.scrollIntoView({ behavior: 'smooth' });
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }
  </script>
</body>
</html>
